name: Report a bug
description: Tell us about something in OpsWolf that didn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This report will be public. Please leave out private file paths, chat text, and credentials.
  - type: input
    id: opswolf-version
    attributes:
      label: Which version of OpsWolf are you using?
      description: Look at the bottom of the file tree. If you can't open it, enter "unknown".
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What were you doing when it happened?
      description: List the steps we can try. If it only happened once, tell us what you remember.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the error message if you saw one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
